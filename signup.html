<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join the club</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="index.html">Club Events</a>
    <nav>
      <a href="index.html">Events</a>
      <a href="#about">About</a>
      <a href="signup.html">Join</a>
    </nav>
  </header>

  <main>
    <h1>Join the club</h1>
        <form id="signup-form" action="#" method="post" novalidate>
      <label for="name">Full name</label>
      <input id="name" name="name" type="text">
      <p class="error" id="name-error"></p>

      <label for="email">Email</label>
      <input id="email" name="email" type="email">
      <p class="error" id="email-error"></p>

      <label for="seats">Seats (1 to 5)</label>
      <input id="seats" name="seats" type="number">
      <p class="error" id="seats-error"></p>

      <button type="submit">Register</button>
      <p id="success"></p>
    </form>
  </main>

  <footer>
    <p>© 2026 Your Name · contact@example.com</p>
  </footer>
    <script src="app.js"></script>
</body>
</html>
